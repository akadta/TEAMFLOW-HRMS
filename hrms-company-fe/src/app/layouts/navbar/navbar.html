<header
  class="flex items-center justify-between rounded-2xl px-4"
  [style]="brand.navbarStyle()"
  [style.color]="brand.navbarText()"
  [style.height.px]="cfg.height">

  <!-- Sidebar toggle -->
  <button
    type="button"
    (click)="toggle.emit()"
    aria-label="Toggle sidebar"
    class="icon-btn grid h-10 w-10 place-items-center rounded-xl transition">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>

  @if (brand.theme().logo.place !== 'sidebar') {
    <div class="ml-3 mr-auto flex min-w-0 items-center gap-2">
      <app-brand-logo [src]="brand.logoUrl()" [logo]="brand.logoStyle()" [size]="36"
        [initial]="brand.initial()" [accent]="brand.theme().accent" [accentText]="brand.accentText()" />
      @if (brand.theme().logo.showName) {
        <span class="hidden truncate text-sm font-semibold sm:block">{{ brand.name() }}</span>
      }
    </div>
  }

  @if (auth.user(); as u) {
    <!-- Avatar + dropdown -->
    <div class="relative">
      <button
        type="button"
        (click)="open.update((v) => !v)"
        aria-haspopup="menu"
        [attr.aria-expanded]="open()"
        class="icon-btn flex items-center gap-3 rounded-xl py-1.5 pl-1.5 pr-3 transition">

        <!-- Profile picture if the employee has one, otherwise the initial -->
        @if (photo(); as src) {
          <span class="block h-9 w-9 shrink-0 overflow-hidden rounded-full">
            <img
              [src]="src"
              alt=""
              draggable="false"
              (error)="photoFailed.set(true)"
              class="h-full w-full scale-[1.15] object-cover object-top" />
          </span>
        } @else {
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-sm font-semibold"
            [style.background]="brand.theme().accent"
            [style.color]="brand.accentText()">
            {{ initial() }}
          </span>
        }

        <span class="hidden text-left sm:block">
          <span class="block text-sm font-semibold leading-tight">{{ u.name }}</span>
          <span class="block text-xs opacity-70">{{ u.roleName }}</span>
        </span>
        <svg
          class="hidden h-4 w-4 opacity-70 transition sm:block"
          [class.rotate-180]="open()"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      @if (open()) {
        <div
          role="menu"
          class="menu-card absolute right-0 top-full mt-2 w-64 overflow-hidden rounded-2xl shadow-2xl"
          [style.background]="brand.theme().navbar"
          [style.color]="brand.navbarText()">

          <div class="divider px-4 py-3">
            <p class="truncate text-sm font-semibold">{{ u.name }}</p>
            @if (cfg.showEmail) {
              <p class="truncate text-xs opacity-70">{{ u.email }}</p>
            }
          </div>

          <div class="p-1.5">
            @for (item of cfg.profileMenu; track item.label) {
              <button
                type="button"
                role="menuitem"
                (click)="onMenu(item)"
                class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition"
                [class.text-red-500]="item.danger">
                <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
                </svg>
                {{ item.label }}
              </button>
            }
          </div>
        </div>
      }
    </div>
  }
</header>
