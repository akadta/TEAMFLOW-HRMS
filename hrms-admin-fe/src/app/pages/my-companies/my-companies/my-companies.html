<div class="min-h-full bg-gradient-to-br from-sky-50 via-white to-blue-100 p-3 sm:p-4">
  <div class="mx-auto max-w-6xl space-y-3">

    <div>
      <h1 class="text-lg font-semibold tracking-tight text-slate-900">{{ title }}</h1>
      <p class="text-xs text-slate-500">{{ shown().length }} of {{ items().length }} company(ies) allocated to you</p>
    </div>

    <!-- filters -->
    <div class="flex flex-wrap items-center gap-2">
      <input [class]="inp + ' w-52'" placeholder="Search company / owner" [value]="search()" (input)="search.set(val($event))" />

      <div class="flex rounded-lg bg-white/70 p-0.5 shadow-sm ring-1 ring-slate-200">
        @for (t of tabs; track t.id) {
          <button type="button" class="rounded-md px-3 py-1.5 text-xs font-semibold transition"
                  [class]="status() === t.id ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-white'"
                  (click)="status.set(t.id)">{{ t.label }}</button>
        }
      </div>

      <input [class]="inp + ' w-28'" type="number" min="0" placeholder="Min employees" [value]="minEmp()" (input)="minEmp.set(val($event))" />
      <input [class]="inp + ' w-28'" type="number" min="0" placeholder="Max employees" [value]="maxEmp()" (input)="maxEmp.set(val($event))" />

      <select [class]="inp" (change)="sort.set(val($event))">
        @for (s of sorts; track s.id) { <option [value]="s.id" [selected]="s.id === sort()">{{ s.label }}</option> }
      </select>

      <button type="button" class="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200" (click)="reset()">Reset</button>
    </div>

    @if (error()) {
      <div class="rounded-lg border border-red-300/60 bg-red-50 px-3 py-2 text-xs text-red-600">{{ error() }}</div>
    }

    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (c of shown(); track c.id) {
        <button type="button" (click)="open(c)"
                class="flex items-center gap-3 rounded-xl border border-white/70 bg-white/70 p-3 text-left shadow-[0_12px_30px_-15px_rgba(37,99,235,0.35)] backdrop-blur-xl transition hover:-translate-y-0.5 hover:shadow-lg">
          @if (c.logo) {
            <img [src]="fileUrl(c.logo)" alt="" class="h-11 w-11 shrink-0 rounded-lg bg-white object-contain ring-1 ring-slate-200" />
          } @else {
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-blue-600 text-sm font-bold text-white">{{ c.name.charAt(0).toUpperCase() }}</div>
          }
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-slate-900">{{ c.name }}</p>
            <p class="truncate text-[11px] text-slate-500">Owner: {{ c.ownerName }}</p>
            <p class="text-[11px] text-slate-500">{{ c.employees }} employee(s)</p>
          </div>
          <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold"
                [class]="c.isActive ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'">{{ c.isActive ? 'Active' : 'Inactive' }}</span>
        </button>
      } @empty {
        <p class="col-span-full rounded-xl border border-dashed border-slate-300 bg-white/60 p-8 text-center text-xs text-slate-500">
          {{ loading() ? 'Loading…' : 'No companies match.' }}
        </p>
      }
    </div>
  </div>
</div>
